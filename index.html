<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Responsive Scientific Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.js"></script>
  <style>
    /* Made to be hosted at a URL and shown in an iframe about 160px wide x 350px tall.
       It fills whatever frame it is given, so page-level rules cannot shift
       anything else on the page. Add ?preview to the URL for a dark backdrop. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #calcWidget, #calcWidget * {
      box-sizing: border-box;
    }

    #calcWidget {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 3px;
      background: transparent !important;
      border: 0;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    /* ---- Output area: scrolling history on top, current line at the bottom ---- */
    #calcWidget .output {
      flex: 0 0 112px;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid #fff !important;
      border-radius: 5px;
      background: transparent !important;
      overflow: hidden;
    }

    #calcWidget .history {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 3px 6px;
      font-size: 11px;
      line-height: 1.35;
      font-weight: normal;
      text-align: left;
      color: rgba(255, 255, 255, 0.75);
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
    }

    #calcWidget .history::-webkit-scrollbar { width: 4px; }
    #calcWidget .history::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.5); border-radius: 2px; }

    #calcWidget .history:empty::before {
      content: "history";
      color: rgba(255, 255, 255, 0.35);
    }

    #calcWidget .history .entry {
      padding: 1px 0;
      word-break: break-all;
    }

    #calcWidget .history .res {
      color: #fff;
      font-weight: bold;
    }

    #calcWidget .display {
      display: block;
      flex: 0 0 44px;
      width: 100%;
      height: 44px;
      margin: 0;
      padding: 3px 6px;
      resize: none;
      overflow-y: auto;
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.2;
      font-weight: bold;
      text-align: left;
      word-break: break-all;
      border: 0;
      border-top: 1px solid rgba(255, 255, 255, 0.6) !important;
      border-radius: 0;
      background: transparent !important;
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      opacity: 1 !important;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
    }

    /* ---- Buttons: 9 rows x 4 columns ---- */
    #calcWidget .buttons {
      flex: 1 1 0;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    #calcWidget .row {
      flex: 1 1 0;
      min-height: 0;
      min-width: 0;
      display: flex;
      gap: 4px;
    }

    #calcWidget .buttons input[type="button"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1 1 0;
      width: 0;
      height: auto;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: clamp(8px, 6.2vw, 14px);
      font-weight: bold;
      line-height: 1;
      border: 1px solid #fff !important;
      border-radius: 5px;
      background: transparent !important;
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      box-shadow: none;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }

    #calcWidget .buttons input[type="button"]:hover {
      background: rgba(255, 255, 255, 0.2) !important;
    }

    #calcWidget .buttons input[type="button"]:active {
      background: rgba(255, 255, 255, 0.35) !important;
    }
  </style>
</head>
<body>
  <div id="calcWidget" class="calculator">
    <div class="output">
      <div class="history" id="calc-history"></div>
      <textarea id="calc-display" class="display" readonly></textarea>
    </div>
    <div class="buttons">
      <div class="row">
        <input type="button" value="C">
        <input type="button" value="⌫">
        <input type="button" value="(">
        <input type="button" value=")">
      </div>
      <div class="row">
        <input type="button" value="7">
        <input type="button" value="8">
        <input type="button" value="9">
        <input type="button" value="/">
      </div>
      <div class="row">
        <input type="button" value="4">
        <input type="button" value="5">
        <input type="button" value="6">
        <input type="button" value="*">
      </div>
      <div class="row">
        <input type="button" value="1">
        <input type="button" value="2">
        <input type="button" value="3">
        <input type="button" value="-">
      </div>
      <div class="row">
        <input type="button" value="0">
        <input type="button" value=".">
        <input type="button" value=",">
        <input type="button" value="+">
      </div>
      <div class="row">
        <input type="button" value="sin(">
        <input type="button" value="cos(">
        <input type="button" value="tan(">
        <input type="button" value="^">
      </div>
      <div class="row">
        <input type="button" value="log(">
        <input type="button" value="log2(">
        <input type="button" value="log10(">
        <input type="button" value="sqrt(">
      </div>
      <div class="row">
        <input type="button" value="e">
        <input type="button" value="pi">
        <input type="button" value="!">
        <input type="button" value="%">
      </div>
      <div class="row">
        <input type="button" value="l2e">
        <input type="button" value="l10e">
        <input type="button" value="exp(">
        <input type="button" value="=">
      </div>
    </div>
  </div>

  <script>
    (function () {
      // Open the page with ?preview on the end of the URL to see it on a dark
      // background. Without it the page stays fully transparent.
      if (/[?&]preview(=|&|$)/.test(location.search)) {
        document.documentElement.style.background = "#1e1e1e";
      }

      var screen = document.getElementById("calc-display");
      var historyBox = document.getElementById("calc-history");
      var isDegrees = true;
      var MAX_HISTORY = 100;

      // Buttons that insert something other than their own label
      var insertText = {
        "^": "^(",
        "l2e": String(Math.LOG2E),
        "l10e": String(Math.LOG10E)
      };

      function show(text) {
        screen.value = text;
        screen.scrollTop = screen.scrollHeight; // keep the newest characters in view
      }

      function addHistory(expr, result) {
        var row = document.createElement("div");
        row.className = "entry";
        row.appendChild(document.createTextNode(expr + " "));
        var res = document.createElement("span");
        res.className = "res";
        res.textContent = "= " + result;
        row.appendChild(res);
        historyBox.appendChild(row);
        while (historyBox.children.length > MAX_HISTORY) {
          historyBox.removeChild(historyBox.firstChild);
        }
        historyBox.scrollTop = historyBox.scrollHeight;
      }

      function backspace() {
        show(screen.value.slice(0, -1));
      }

      function addDecimal() {
        // allow one decimal point per number (not one per whole expression)
        var lastNumber = screen.value.match(/[0-9.]*$/)[0];
        if (lastNumber.indexOf(".") === -1) {
          show(screen.value + ".");
        }
      }

      function calculate() {
        var original = screen.value;
        if (!original.trim()) return;
        var expression = original;
        try {
          if (isDegrees) {
            expression = expression.replace(/sin\(/g, "sin(" + Math.PI / 180 + "*");
            expression = expression.replace(/cos\(/g, "cos(" + Math.PI / 180 + "*");
            expression = expression.replace(/tan\(/g, "tan(" + Math.PI / 180 + "*");
          }
          var result = math.evaluate(expression);
          if (result === undefined) throw new Error("no result");
          var text = math.format(result, 14);
          addHistory(original, text);
          show(text);
        } catch (err) {
          show("Error");
          setTimeout(function () {
            if (screen.value === "Error") show("");
          }, 2000);
        }
      }

      document.querySelector(".buttons").addEventListener("click", function (e) {
        var btn = e.target;
        if (!btn || btn.type !== "button") return;
        var v = btn.value;

        if (v === "C") show("");
        else if (v === "\u232B") backspace();
        else if (v === ".") addDecimal();
        else if (v === "=") calculate();
        else if (Object.prototype.hasOwnProperty.call(insertText, v)) show(screen.value + insertText[v]);
        else show(screen.value + v);
      });
    })();
  </script>
</body>
</html>
