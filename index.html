<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Responsive Scientific Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.js"></script>
  <style>
    /* Made to be hosted at a URL and shown in Renewed Tab's IFrame widget.
       The iframe isolates this page, so these page-level rules cannot shift
       anything else on the new tab page. */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #calcWidget, #calcWidget * {
      box-sizing: border-box;
    }

    #calcWidget {
      position: relative;
      width: 430px;
      height: 310px;
      max-width: 100%;
      max-height: 100%;
      margin: 0;
      padding: 3px;
      background: transparent !important;
      border: 0;
      border-radius: 5px;
      font-family: Arial, sans-serif;
      font-weight: bold;
      display: flex;
      flex-direction: column;
      gap: 6px;
      overflow: hidden;
    }

    #calcWidget .display {
      display: block;
      width: 100%;
      height: 38px;
      flex: none;
      margin: 0;
      padding: 0 10px;
      font-family: Arial, sans-serif;
      font-size: 20px;
      font-weight: bold;
      text-align: left;
      border: 2px solid #fff !important;
      border-radius: 5px;
      background: transparent !important;
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      opacity: 1 !important;
      box-shadow: none;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    #calcWidget .buttons {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-template-rows: repeat(6, minmax(0, 1fr));
      gap: 4px;
      overflow: hidden;
    }

    #calcWidget .buttons input[type="button"] {
      -webkit-appearance: none;
      appearance: none;
      width: auto;
      height: auto;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      line-height: 1;
      border: 1px solid #fff !important;
      border-radius: 5px;
      background: transparent !important;
      color: #fff !important;
      -webkit-text-fill-color: #fff !important;
      box-shadow: none;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }

    #calcWidget .buttons input[type="button"]:hover {
      background: rgba(255, 255, 255, 0.2) !important;
    }

    #calcWidget .buttons input[type="button"]:active {
      background: rgba(255, 255, 255, 0.35) !important;
    }
  </style>
</head>
<body>
  <div id="calcWidget" class="calculator">
    <input type="text" id="calc-display" class="display" readonly />
    <div class="buttons">
      <input type="button" value="1">
      <input type="button" value="2">
      <input type="button" value="3">
      <input type="button" value="4">
      <input type="button" value="5">
      <input type="button" value="6">
      <input type="button" value="7">
      <input type="button" value="8">
      <input type="button" value="9">
      <input type="button" value="0">

      <input type="button" value="C">
      <input type="button" value="⌫">
      <input type="button" value="*">
      <input type="button" value="+">
      <input type="button" value="-">
      <input type="button" value="/">
      <input type="button" value="!">
      <input type="button" value=".">
      <input type="button" value=",">

      <input type="button" value="%">
      <input type="button" value="cos(">
      <input type="button" value="sin(">
      <input type="button" value="tan(">

      <input type="button" value="e">
      <input type="button" value="pi">
      <input type="button" value="^">
      <input type="button" value="(">
      <input type="button" value=")">
      <input type="button" value="log(">

      <input type="button" value="sqrt(">
      <input type="button" value="log2(">
      <input type="button" value="log10(">
      <input type="button" value="l2e">
      <input type="button" value="l10e">
      <input type="button" value="exp(">

      <input type="button" value="=">
    </div>
  </div>

  <script>
    (function () {
      var root = document.getElementById("calcWidget");
      var screen = root.querySelector(".display");
      var isDegrees = true;

      // Buttons that insert something other than their own label
      var insertText = {
        "^": "^(",
        "l2e": String(Math.LOG2E),
        "l10e": String(Math.LOG10E)
      };

      function backspace() {
        screen.value = screen.value.slice(0, -1);
      }

      function addDecimal() {
        if (!screen.value.includes(".")) {
          screen.value += ".";
        }
      }

      function calculate() {
        var expression = screen.value;
        try {
          if (isDegrees) {
            expression = expression.replace(/sin\(/g, "sin(" + Math.PI / 180 + "*");
            expression = expression.replace(/cos\(/g, "cos(" + Math.PI / 180 + "*");
            expression = expression.replace(/tan\(/g, "tan(" + Math.PI / 180 + "*");
          }
          screen.value = math.evaluate(expression);
        } catch (err) {
          screen.value = "Error";
          setTimeout(function () { screen.value = ""; }, 2000);
        }
      }

      root.querySelector(".buttons").addEventListener("click", function (e) {
        var btn = e.target;
        if (!btn || btn.type !== "button") return;
        var v = btn.value;

        if (v === "C") screen.value = "";
        else if (v === "\u232B") backspace();
        else if (v === ".") addDecimal();
        else if (v === "=") calculate();
        else if (Object.prototype.hasOwnProperty.call(insertText, v)) screen.value += insertText[v];
        else screen.value += v;
      });
    })();
  </script>
</body>
</html>
